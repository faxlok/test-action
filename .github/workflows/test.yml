name: Build Unsigned iOS WebView App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名称'
        required: true
        default: 'MyWebApp'
      app_url:
        description: '加载的网址'
        required: true
        default: 'https://www.apple.com'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Random Bundle ID and Version
        run: |
          BUNDLE_ID="com.$(openssl rand -hex 2).$(openssl rand -hex 2)"
          VERSION="$(jot -r 1 1 5).$(jot -r 1 0 9).$(jot -r 1 0 9)"
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Swift Source Files
        run: |
          mkdir -p WebApp/Sources
          # 直接将输入的 URL 写入 Swift 代码，取代无效的 ProcessInfo 环境变量读取
          cat > WebApp/Sources/WebApp.swift <<EOF
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              let url: String
              func makeUIView(context: Context) -> WKWebView {
                  let webView = WKWebView()
                  if let parsedURL = URL(string: url) {
                      webView.load(URLRequest(url: parsedURL))
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct WebApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebView(url: "${{ github.event.inputs.app_url }}")
                  }
              }
          }
          EOF

      - name: Generate Xcode Project (using XcodeGen)
        run: |
          # 动态生成项目配置，强制关闭签名机制
          cat > project.yml <<EOF
          name: WebApp
          options:
            bundleIdPrefix: com.example
          targets:
            WebApp:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [WebApp/Sources]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${{ env.BUNDLE_ID }}
                  MARKETING_VERSION: ${{ env.VERSION }}
                  PRODUCT_NAME: "${{ github.event.inputs.app_name }}"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  GENERATE_INFOPLIST_FILE: "YES" 
          EOF
          xcodegen generate

      - name: Build Unsigned App
        run: |
          # 指定 CONFIGURATION_BUILD_DIR 确保我们知道产物输出在哪里
          xcodebuild -project WebApp.xcodeproj \
            -scheme WebApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          
          # 获取用户输入的 App 名称
          APP_NAME="${{ github.event.inputs.app_name }}"
          
          echo "准备打包的产物是: build/${APP_NAME}.app"
          
          # 复制正确的 .app 文件夹到 Payload
          cp -r "build/${APP_NAME}.app" Payload/
          
          # 压缩生成对应名称的 .ipa 文件
          zip -r "${APP_NAME}.ipa" Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Unsigned
          # 路径需要与上面生成的 ipa 名字保持一致
          path: ${{ github.event.inputs.app_name }}.ipa
          retention-days: 7