name: Build Unsigned iOS WebView App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名称'
        required: true
        default: 'MyWebApp'
      app_url:
        description: '加载的网址'
        required: true
        default: 'https://www.apple.com'
      icon_path:
        description: '图标文件路径 (PNG)'
        required: true
        default: 'assets/icon.png'
      launch_path:
        description: '启动图文件路径 (PNG)'
        required: true
        default: 'assets/launch.png'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Random Bundle ID and Version
        run: |
          BUNDLE_ID="com.$(openssl rand -hex 2).$(openssl rand -hex 2)"
          VERSION="$(jot -r 1 1 5).$(jot -r 1 0 9).$(jot -r 1 0 9)"
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Swift Source Files
        run: |
          mkdir -p WebApp/Sources
          
          # 还原纯净的 SwiftUI WebView 容器，启动图剥离出来交给系统底层托管
          cat > WebApp/Sources/WebApp.swift <<EOF
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              let url: String
              func makeUIView(context: Context) -> WKWebView {
                  let webView = WKWebView()
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  if let parsedURL = URL(string: url) {
                      webView.load(URLRequest(url: parsedURL))
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct WebApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebView(url: "${{ github.event.inputs.app_url }}")
                          .edgesIgnoringSafeArea(.all) // 网页强制全屏幕铺满
                  }
              }
          }
          EOF

          # 创建 iOS 官方标准的全屏 LaunchScreen 故事板（利用底层约束强行破除黑边）
          cat > WebApp/Sources/LaunchScreen.storyboard <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21507" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21505"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <imageView clipsSubviews="YES" userInteractionEnabled="NO" contentMode="scaleAspectFill" horizontalHuggingPriority="251" verticalHuggingPriority="251" image="LaunchImage" translatesAutoresizingMaskIntoConstraints="NO" id="i8P-xe-gZ2">
                                          <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                      </imageView>
                                  </subviews>
                                  <viewLayoutGuide key="safeArea" id="6Tk-OE-BBY"/>
                                  <color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                                  <constraints>
                                      <constraint firstItem="i8P-xe-gZ2" firstAttribute="leading" secondItem="Ze5-6b-2t3" secondAttribute="leading" id="A1A-1A-A1a"/>
                                      <constraint firstAttribute="trailing" secondItem="i8P-xe-gZ2" secondAttribute="trailing" id="B1B-1B-B1b"/>
                                      <constraint firstItem="i8P-xe-gZ2" firstAttribute="top" secondItem="Ze5-6b-2t3" secondAttribute="top" id="C1C-1C-C1c"/>
                                      <constraint firstAttribute="bottom" secondItem="i8P-xe-gZ2" secondAttribute="bottom" id="D1D-1D-D1d"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          EOF

      - name: Create Info.plist Manually
        run: |
          cat > WebApp/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>\$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>\$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>\$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleExecutable</key>
              <string>\$(EXECUTABLE_NAME)</string>
              
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

      - name: Prepare Assets (Icon & Launch Image)
        run: |
          mkdir -p WebApp/Sources/Assets.xcassets/AppIcon.appiconset
          mkdir -p WebApp/Sources/Assets.xcassets/LaunchImage.imageset

          # 1. 图标处理：强制把 100x100 拉伸到官方标准的 1024x1024
          sips -s format png -z 1024 1024 ${{ github.event.inputs.icon_path }} --out WebApp/Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          cat > WebApp/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<EOF
          {
            "images" : [
              { "idiom" : "universal", "platform" : "ios", "size" : "1024x1024", "filename" : "icon-1024.png" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

          # 2. 启动图核心修复：利用 sips 命令，强制把你的 100x100 像素小图拉伸到高素质全面屏物理分辨率（2688高 x 1242宽）
          # 这样可以 100% 绕过 iOS 针对低分辨率资产启动图的安全降级黑边惩罚！
          sips -s format png -z 2688 1242 ${{ github.event.inputs.launch_path }} --out WebApp/Sources/Assets.xcassets/LaunchImage.imageset/launch.png
          cat > WebApp/Sources/Assets.xcassets/LaunchImage.imageset/Contents.json <<EOF
          {
            "images" : [
              { "idiom" : "universal", "filename" : "launch.png" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

      - name: Generate Xcode Project (using XcodeGen)
        run: |
          cat > project.yml <<EOF
          name: WebApp
          targets:
            WebApp:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [WebApp/Sources]
              info:
                path: WebApp/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${{ env.BUNDLE_ID }}
                  MARKETING_VERSION: ${{ env.VERSION }}
                  PRODUCT_NAME: "${{ github.event.inputs.app_name }}"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
          EOF
          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project WebApp.xcodeproj \
            -scheme WebApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_NAME="${{ github.event.inputs.app_name }}"
          cp -r "build/${APP_NAME}.app" Payload/
          zip -r "${APP_NAME}.ipa" Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Unsigned
          path: ${{ github.event.inputs.app_name }}.ipa
          retention-days: 7
