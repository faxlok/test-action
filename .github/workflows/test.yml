name: Build Unsigned iOS WebView App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '应用名称'
        required: true
        default: 'MyWebApp'
      app_url:
        description: '加载的网址'
        required: true
        default: 'https://www.apple.com'
      icon_path:
        description: '图标文件路径 (JPG/PNG)'
        required: true
        default: 'assets/icon.jpg'
      launch_path:
        description: '启动图文件路径 (JPG/PNG)'
        required: true
        default: 'assets/icon.jpg'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Random Bundle ID and Version
        run: |
          BUNDLE_ID="com.$(openssl rand -hex 2).$(openssl rand -hex 2)"
          VERSION="$(jot -r 1 1 5).$(jot -r 1 0 9).$(jot -r 1 0 9)"
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Swift Source Files
        run: |
          mkdir -p WebApp/Sources
          
          cat > WebApp/Sources/WebApp.swift <<EOF
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              let url: String
              func makeUIView(context: Context) -> WKWebView {
                  let webView = WKWebView()
                  // 禁用 WebView 内部的安全区域缩进，配合外层实现真正全屏
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  if let parsedURL = URL(string: url) {
                      webView.load(URLRequest(url: parsedURL))
                  }
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          @main
          struct WebApp: App {
              var body: some Scene {
                  WindowGroup {
                      WebView(url: "${{ github.event.inputs.app_url }}")
                          .edgesIgnoringSafeArea(.all) // 强制填满刘海屏和底部黑条
                  }
              }
          }
          EOF

      - name: Create Info.plist Manually
        run: |
          # 手动手搓一个现代的 Info.plist，注入核心全屏密钥
          cat > WebApp/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>\$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>\$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>\$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleExecutable</key>
              <string>\$(EXECUTABLE_NAME)</string>
              
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIImageName</key>
                  <string>LaunchImage</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Prepare Assets (Icon & Launch Image)
        run: |
          mkdir -p WebApp/Sources/Assets.xcassets/AppIcon.appiconset
          mkdir -p WebApp/Sources/Assets.xcassets/LaunchImage.imageset

          # 1. 图标处理
          sips -s format png -z 1024 1024 ${{ github.event.inputs.icon_path }} --out WebApp/Sources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          cat > WebApp/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<EOF
          {
            "images" : [
              {
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024",
                "filename" : "icon-1024.png"
              }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

          # 2. 启动图处理 (转为标准 PNG 并用通用自适应配置)
          sips -s format png ${{ github.event.inputs.launch_path }} --out WebApp/Sources/Assets.xcassets/LaunchImage.imageset/launch.png
          cat > WebApp/Sources/Assets.xcassets/LaunchImage.imageset/Contents.json <<EOF
          {
            "images" : [
              {
                "idiom" : "universal",
                "filename" : "launch.png"
              }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          EOF

      - name: Generate Xcode Project (using XcodeGen)
        run: |
          cat > project.yml <<EOF
          name: WebApp
          targets:
            WebApp:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources: [WebApp/Sources]
              info:
                path: WebApp/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: ${{ env.BUNDLE_ID }}
                  MARKETING_VERSION: ${{ env.VERSION }}
                  PRODUCT_NAME: "${{ github.event.inputs.app_name }}"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
          EOF
          xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project WebApp.xcodeproj \
            -scheme WebApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_NAME="${{ github.event.inputs.app_name }}"
          cp -r "build/${APP_NAME}.app" Payload/
          zip -r "${APP_NAME}.ipa" Payload

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Unsigned
          path: ${{ github.event.inputs.app_name }}.ipa
          retention-days: 7
